name: Test license-key input (backward compatibility)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample migration file
        run: |
          mkdir -p /tmp/migrations
          cat > /tmp/migrations/001_create_users.sql << 'EOF'
          CREATE TABLE users (
            id SERIAL PRIMARY KEY,
            email TEXT NOT NULL
          );
          EOF

      - id: action
        uses: .
        with:
          migration-path: /tmp/migrations
          license-key: LEGACY-KEY-12345
          fail-on: never

      - name: Assert outputs are present
        env:
          RISK: ${{ steps.action.outputs.risk-level }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          SARIF: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "risk-level: $RISK"
          echo "violations: $VIOLATIONS"
          echo "sarif-file: $SARIF"
          if [ -z "$RISK" ]; then
            echo "FAIL: risk-level output is empty"
            exit 1
          fi
          case "$RISK" in
            RED|YELLOW|GREEN)
              echo "PASS: risk-level is valid: $RISK"
              ;;
            *)
              echo "FAIL: unexpected risk-level value: $RISK"
              exit 1
              ;;
          esac
          echo "PASS: license-key accepted for backward compatibility"
