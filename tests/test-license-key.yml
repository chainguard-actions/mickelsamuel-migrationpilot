name: Test license-key input (backward compatibility)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create migration directory with a simple SQL file
        run: |
          mkdir -p migrations
          cat > migrations/001_create_users.sql << 'EOF'
          CREATE TABLE users (
            id SERIAL PRIMARY KEY,
            email TEXT NOT NULL
          );
          EOF

      - id: action
        uses: .
        with:
          migration-path: 'migrations/*.sql'
          github-token: ${{ github.token }}
          pg-version: '17'
          fail-on: 'critical'
          license-key: 'LEGACY-KEY-12345'

      - name: Assert risk-level output is set
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          if [ -z "$RISK_LEVEL" ]; then
            echo "FAIL: expected risk-level output to be set"
            exit 1
          fi
          echo "PASS: risk-level is '$RISK_LEVEL'"

      - name: Assert violations output is set
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ -z "$VIOLATIONS" ]; then
            echo "FAIL: expected violations output to be set"
            exit 1
          fi
          echo "PASS: violations is '$VIOLATIONS'"
