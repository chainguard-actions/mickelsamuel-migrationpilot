name: Test license-key input (org plan features)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a safe migration file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-migrations-lic"
          cat > "$GITHUB_WORKSPACE/test-migrations-lic/001_create_table.sql" <<'EOF'
          CREATE TABLE IF NOT EXISTS products (
            id SERIAL PRIMARY KEY,
            name TEXT NOT NULL,
            price NUMERIC(10,2)
          );
          EOF

      - id: action
        uses: .
        with:
          migration-path: "test-migrations-lic/*.sql"
          github-token: ${{ github.token }}
          license-key: "TEST-LICENSE-KEY-PLACEHOLDER"
          fail-on: never
        continue-on-error: true

      - name: Assert action ran with license-key input
        env:
          RISK: ${{ steps.action.outputs.risk-level }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "risk-level: $RISK"
          echo "violations: $VIOLATIONS"

          # The action may reject the placeholder license key or accept it.
          # Either outcome is acceptable — what matters is that the input was
          # accepted by the action runner and the action did not crash with an
          # unrelated error (e.g. unknown input).
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RISK" ]; then
              echo "FAIL: action succeeded but risk-level output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with license-key; risk-level='$RISK' violations='$VIOLATIONS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid/placeholder license key is expected to be rejected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
