name: Test license-key input (backward compatibility)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          migration-path: 'migrations/*.sql'
          github-token: ${{ github.token }}
          license-key: 'LEGACY-KEY-FOR-BACKWARD-COMPAT'
      - name: Assert risk-level is GREEN (non-PR early exit with license-key)
        env:
          RISK: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "risk-level: $RISK"
          if [ "$RISK" != "GREEN" ]; then
            echo "FAIL: expected risk-level to be GREEN, got '$RISK'"
            exit 1
          fi
          echo "PASS: risk-level is GREEN"
      - name: Assert violations is 0 (non-PR early exit with license-key)
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected violations to be 0, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: violations is 0"
