name: Test missing config-file fails the run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a migration file
        run: |
          mkdir -p tests/fixtures/migrations
          cat > tests/fixtures/migrations/001_create_users.sql << 'EOF'
          CREATE TABLE users (id SERIAL PRIMARY KEY);
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          migration-path: tests/fixtures/migrations/*.sql
          github-token: ${{ github.token }}
          config-file: /nonexistent/path/.migrationpilotrc.yml

      - name: Assert action failed due to missing config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when config-file does not exist"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for a nonexistent config-file"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
