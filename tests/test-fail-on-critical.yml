name: Test fail-on critical behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          migration-path: tests/fixtures/migrations/risky
          github-token: ${{ github.token }}
          pg-version: '17'
          fail-on: 'critical'
        continue-on-error: true

      - name: Assert action outcome is success or failure (not skipped)
        env:
          RISK: ${{ steps.action.outputs.risk-level }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          SARIF: ${{ steps.action.outputs.sarif-file }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome:    $OUTCOME"
          echo "risk-level: $RISK"
          echo "violations: $VIOLATIONS"
          echo "sarif-file: $SARIF"

          # The action must NOT be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi

          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch (no PR), the action exits early with GREEN/0
            # No critical violations can be found without a PR, so success is expected
            if [ -n "$RISK" ]; then
              case "$RISK" in
                RED|YELLOW|GREEN)
                  echo "PASS: risk-level is valid: $RISK"
                  ;;
                *)
                  echo "FAIL: unexpected risk-level value: $RISK"
                  exit 1
                  ;;
              esac
            fi
            if [ -n "$VIOLATIONS" ]; then
              if ! echo "$VIOLATIONS" | grep -qE '^[0-9]+$'; then
                echo "FAIL: violations is not a non-negative integer: $VIOLATIONS"
                exit 1
              fi
            fi
            echo "PASS: action succeeded (no PR context under workflow_dispatch)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist artifact may not be built, or critical violations found)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
