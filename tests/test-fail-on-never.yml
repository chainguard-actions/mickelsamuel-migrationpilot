name: Test fail-on never - action should not fail even with violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create risky migration file
        run: |
          mkdir -p tests/fixtures/migrations/fail-on-never
          cat > tests/fixtures/migrations/fail-on-never/001_drop_column.sql << 'EOF'
          ALTER TABLE users DROP COLUMN email;
          DROP TABLE orders;
          ALTER TABLE products ADD COLUMN price DECIMAL NOT NULL;
          EOF

      - id: action
        uses: .
        with:
          migration-path: tests/fixtures/migrations/fail-on-never
          github-token: ${{ github.token }}
          pg-version: '17'
          fail-on: 'never'

      - name: Assert action completed and outputs are set
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          echo "violations: $VIOLATIONS"
          if [ -z "$RISK_LEVEL" ]; then
            echo "FAIL: risk-level output is empty"
            exit 1
          fi
          if [ -z "$VIOLATIONS" ]; then
            echo "FAIL: violations output is empty"
            exit 1
          fi
          echo "PASS: action completed with fail-on=never, risk-level=$RISK_LEVEL, violations=$VIOLATIONS"

      - name: Assert risk-level is GREEN (no PR context under workflow_dispatch)
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          if [ "$RISK_LEVEL" != "GREEN" ]; then
            echo "FAIL: expected GREEN (action skips analysis outside PR context), got $RISK_LEVEL"
            exit 1
          fi
          echo "PASS: risk-level is GREEN as expected outside PR context"

      - name: Assert violations is 0 (no PR context under workflow_dispatch)
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations (action skips analysis outside PR context), got $VIOLATIONS"
            exit 1
          fi
          echo "PASS: violations is 0 as expected outside PR context"
