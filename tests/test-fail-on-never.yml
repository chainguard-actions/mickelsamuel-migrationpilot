name: Test fail-on never option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create migration directory
        run: |
          mkdir -p migrations
          cat > migrations/001_drop_column.sql << 'EOF'
          ALTER TABLE users DROP COLUMN old_field;
          EOF

      - id: action
        uses: .
        with:
          migration-path: 'migrations/*.sql'
          github-token: ${{ github.token }}
          fail-on: 'never'

      - name: Assert action did not fail with fail-on never
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          echo "violations: $VIOLATIONS"
          # In non-PR context, action skips analysis and returns GREEN/0
          if [ "$RISK_LEVEL" != "GREEN" ]; then
            echo "FAIL: expected risk-level=GREEN in non-PR context, got '$RISK_LEVEL'"
            exit 1
          fi
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected violations=0 in non-PR context, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: action ran successfully with fail-on=never"
