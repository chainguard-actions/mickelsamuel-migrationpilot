name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create migration directory and config file
        run: |
          mkdir -p migrations
          cat > .migrationpilotrc.yml << 'EOF'
          pgVersion: 15
          failOn: warning
          rules:
            MP001:
              severity: warning
          EOF

      - id: action
        uses: .
        with:
          migration-path: 'migrations/**/*.sql'
          config-file: '.migrationpilotrc.yml'

      - name: Assert risk-level is GREEN (non-PR context skips analysis)
        env:
          RISK: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "risk-level: $RISK"
          if [ "$RISK" != "GREEN" ]; then
            echo "FAIL: expected risk-level=GREEN but got '$RISK'"
            exit 1
          fi
          echo "PASS: risk-level is GREEN"

      - name: Assert violations is 0
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected violations=0 but got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: violations is 0"
