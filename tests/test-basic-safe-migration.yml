name: Test basic safe migration (non-PR early exit)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          migration-path: migrations
          github-token: ${{ github.token }}
          pg-version: '17'
          fail-on: 'critical'

      - name: Assert risk-level output is GREEN (non-PR early exit)
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          if [ "$RISK_LEVEL" != "GREEN" ]; then
            echo "FAIL: expected GREEN risk-level for non-PR run, got '$RISK_LEVEL'"
            exit 1
          fi
          echo "PASS: risk-level is GREEN as expected for non-PR run"

      - name: Assert violations output is 0 (non-PR early exit)
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected violations=0 for non-PR run, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: violations is 0 as expected for non-PR run"
