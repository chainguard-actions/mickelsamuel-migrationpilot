name: Test basic safe migration analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          migration-path: tests/fixtures/migrations/safe
          pg-version: '17'
          fail-on: 'critical'
        continue-on-error: true

      - name: Assert outputs are set
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "risk-level: $RISK_LEVEL"
          echo "violations: $VIOLATIONS"
          echo "sarif-file: $SARIF_FILE"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RISK_LEVEL" ]; then
              echo "FAIL: action succeeded but risk-level output is empty"
              exit 1
            fi
            echo "PASS: risk-level='$RISK_LEVEL' violations='$VIOLATIONS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or license restriction)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
