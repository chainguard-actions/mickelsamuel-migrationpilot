name: Test basic usage - safe migration (GREEN)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create safe migration file
        run: |
          mkdir -p tests/fixtures/migrations/safe
          cat > tests/fixtures/migrations/safe/001_create_table.sql << 'EOF'
          CREATE TABLE IF NOT EXISTS users (
            id SERIAL PRIMARY KEY,
            name VARCHAR(255) NOT NULL,
            email VARCHAR(255) UNIQUE NOT NULL,
            created_at TIMESTAMP DEFAULT NOW()
          );
          EOF

      - id: action
        uses: .
        with:
          migration-path: tests/fixtures/migrations/safe
          github-token: ${{ github.token }}
          pg-version: '17'
          fail-on: 'never'

      - name: Assert risk-level output is GREEN
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          if [ -z "$RISK_LEVEL" ]; then
            echo "FAIL: risk-level output is empty"
            exit 1
          fi
          if [ "$RISK_LEVEL" != "GREEN" ]; then
            echo "FAIL: expected GREEN risk level (action runs outside PR context), got $RISK_LEVEL"
            exit 1
          fi
          echo "PASS: risk-level is GREEN as expected"

      - name: Assert violations output is 0
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ -z "$VIOLATIONS" ]; then
            echo "FAIL: violations output is empty"
            exit 1
          fi
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations (action runs outside PR context), got $VIOLATIONS"
            exit 1
          fi
          echo "PASS: violations is 0 as expected"
