name: Test pg-version input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create migration directory with SQL file
        run: |
          mkdir -p migrations
          cat > migrations/001_create_table.sql << 'EOF'
          CREATE TABLE orders (
            id BIGSERIAL PRIMARY KEY,
            user_id INTEGER NOT NULL,
            created_at TIMESTAMPTZ DEFAULT NOW()
          );
          EOF

      - id: action
        uses: .
        with:
          migration-path: 'migrations/*.sql'
          github-token: ${{ github.token }}
          pg-version: '14'
          fail-on: 'critical'

      - name: Assert action ran successfully with pg-version 14
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          echo "violations: $VIOLATIONS"
          # In non-PR context, action skips analysis and returns GREEN/0
          if [ "$RISK_LEVEL" != "GREEN" ]; then
            echo "FAIL: expected risk-level=GREEN in non-PR context, got '$RISK_LEVEL'"
            exit 1
          fi
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected violations=0 in non-PR context, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: action accepted pg-version=14 and returned GREEN/0"
