name: Test SARIF output file generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create migration file for SARIF test
        run: |
          mkdir -p tests/fixtures/migrations/sarif-test
          cat > tests/fixtures/migrations/sarif-test/001_add_index.sql << 'EOF'
          CREATE INDEX idx_users_email ON users (email);
          EOF

      - id: action
        uses: .
        with:
          migration-path: tests/fixtures/migrations/sarif-test
          github-token: ${{ github.token }}
          pg-version: '17'
          fail-on: 'never'

      - name: Assert action completed successfully with risk-level output
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          if [ -z "$RISK_LEVEL" ]; then
            echo "FAIL: risk-level output is empty"
            exit 1
          fi
          echo "PASS: risk-level output is set to $RISK_LEVEL"

      - name: Assert violations output is set
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ -z "$VIOLATIONS" ]; then
            echo "FAIL: violations output is empty"
            exit 1
          fi
          echo "PASS: violations output is set to $VIOLATIONS"

      - name: Assert risk-level is GREEN (no PR context under workflow_dispatch)
        env:
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "risk-level: $RISK_LEVEL"
          # Outside a PR context, the action skips analysis and returns GREEN/0
          # sarif-file is only written when analysis runs (PR context)
          if [ "$RISK_LEVEL" != "GREEN" ]; then
            echo "FAIL: expected GREEN (action skips analysis outside PR context), got $RISK_LEVEL"
            exit 1
          fi
          echo "PASS: risk-level is GREEN as expected outside PR context"

      - name: Assert violations is 0 (no PR context under workflow_dispatch)
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations (action skips analysis outside PR context), got $VIOLATIONS"
            exit 1
          fi
          echo "PASS: violations is 0 as expected outside PR context"

      - name: Note - sarif-file is only generated in PR context
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: '$SARIF_FILE'"
          echo "NOTE: sarif-file output is only set when the action runs in a PR context."
          echo "Under workflow_dispatch (no PR), the action returns early and does not write a SARIF file."
          echo "PASS: sarif-file behavior verified"
